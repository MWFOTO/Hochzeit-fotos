<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dein Konto · Event-Fotos</title><link rel="stylesheet" href="/style.css"></head><body><header class="site-header"><a class="brand" href="/">◈ <span>Event-Fotos</span></a><a class="button secondary" href="/dashboard">Mein Konto</a></header><main class="auth-page"><div class="auth-art"><img src="/photographer.webp" alt="Comic-Fotograf"><h2>Eure Momente.<br>Dein Überblick.</h2></div><section class="auth-card"><span class="eyebrow">WILLKOMMEN ZURÜCK</span><h1>Dein Konto</h1><p>Veranstaltungen erstellen und eure Fotos verwalten.</p><form id="login-form"><label>E-Mail<input id="email" type="email" autocomplete="email" required placeholder="du@beispiel.de"></label><label>Passwort<input id="password" type="password" minlength="12" maxlength="128" autocomplete="current-password" required></label><p class="small">Für ein neues Konto: Passwort mit mindestens 12 Zeichen wählen.</p><button class="primary" type="submit">Anmelden</button><button class="secondary" type="button" id="register">Neues Konto erstellen</button></form><p id="message" role="status" aria-live="polite"></p></section></main><script src="/account.js"></script></body></html>
