<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diashow</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="slideshow-page" id="slideshow">

    <!-- Platzhalter, solange noch keine Fotos hochgeladen wurden -->
    <div class="slideshow-placeholder" id="placeholder">
      <div>📷 Noch keine Fotos vorhanden</div>
      <div class="qr-hint">Fotos werden hier automatisch angezeigt, sobald Gäste sie hochladen.</div>
    </div>

    <div class="new-photo-badge" id="new-badge">Neues Foto ✨</div>
    <div class="slide-counter" id="counter"></div>

    <!-- Klick-Zonen für manuelle Steuerung per Maus/Touch (linke Hälfte = zurück, rechte = vor) -->
    <div class="nav-zone nav-zone-left" id="nav-prev" title="Vorheriges Foto"></div>
    <div class="nav-zone nav-zone-right" id="nav-next" title="Nächstes Foto"></div>

    <div class="controls-hint" id="controls-hint">
      ← → zum Blättern · Leertaste zum Pausieren
    </div>
    <div class="pause-badge" id="pause-badge">⏸ Pausiert</div>
  </main>

  <script src="/slideshow.js"></script>
</body>
</html>
