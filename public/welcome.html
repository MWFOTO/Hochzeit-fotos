<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#202329" />
  <title>Willkommen · FinalSnap</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/guest-access.js"></script>
</head>
<body class="guest-welcome-body">
  <main class="guest-welcome" aria-labelledby="welcome-title">
    <header class="guest-welcome-brand"><img src="/finalsnap-logo.webp" alt="FinalSnap" width="150" height="89" /></header>
    <section class="guest-welcome-card">
      <img class="guest-welcome-cover" id="welcome-cover" alt="" hidden />
      <span class="eyebrow">IHR SEID DABEI</span>
      <h1 id="welcome-title">Willkommen zu eurer Feier</h1>
      <p id="welcome-copy">Teile deine schönsten Momente mit allen – direkt von deinem Handy.</p>
      <a class="button primary guest-welcome-primary" id="welcome-upload" href="#">📸 Foto teilen</a>
      <a class="button secondary guest-welcome-camera" id="welcome-camera" href="#">Foto aufnehmen</a>
      <nav class="guest-welcome-links" aria-label="Weitere Bereiche">
        <a id="welcome-gallery" href="#">Alle Fotos ansehen</a>
        <a id="welcome-guestbook" href="#">Gästebuch</a>
        <a id="welcome-games" href="#">Fotoaufgaben</a>
      </nav>
    </section>
    <footer class="guest-welcome-footer">Fotos geteilt mit <strong>FinalSnap</strong></footer>
  </main>
  <script src="/welcome.js"></script>
</body>
</html>
