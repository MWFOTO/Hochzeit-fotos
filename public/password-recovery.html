<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passwort zurücksetzen</title><link rel="stylesheet" href="/style.css"></head><body><main class="account-page"><h1>Passwort zurücksetzen</h1><form id="recovery-form"><label id="email-label">E-Mail<input id="recovery-email" type="email" autocomplete="email"></label><label id="password-label" hidden>Neues Passwort<input id="new-password" type="password" minlength="12" maxlength="128" autocomplete="new-password"></label><label id="repeat-label" hidden>Passwort wiederholen<input id="repeat-password" type="password" autocomplete="new-password"></label><button class="primary" id="recovery-submit">Link anfordern</button></form><p id="recovery-status" role="status" aria-live="polite"></p><a class="button secondary" href="/login">← Zur Anmeldung</a></main><script src="/password-recovery.js"></script></body></html>
