<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fotos verwalten</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="site-header"><a class="brand" href="/" aria-label="FinalSnap Startseite"><span class="brand-mark">ϟ</span><span>FinalSnap</span></a><span class="eyebrow">GÄSTEALBUM</span></header>
  <main class="upload-page">
    <div class="logo">📦</div>
    <h1 class="event-title">Fotos verwalten</h1>
    <p class="event-subtitle">
      Lade hier alle bisher hochgeladenen Fotos dieses Events als
      ZIP-Datei herunter, z.B. bevor du den Server nach dem Event abschaltest.
    </p>

    <button class="upload-btn" id="download-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Alle Fotos als ZIP herunterladen
    </button>

    <p class="status" id="status"></p>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
