<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Meine Veranstaltungen</title><link rel="stylesheet" href="/style.css"></head><body><main class="account-page"><h1>Meine Veranstaltungen</h1><p>Stripe-Testmodus · Es werden keine echten Zahlungen angenommen.</p><button id="logout">Abmelden</button><h2>Neue Veranstaltung</h2><form id="event-form"><p><label>Titel <input id="title" maxlength="120" required placeholder="Geburtstag, Firmenfeier, Hochzeit …"></label></p><p><label>Event-ID <input id="event-id" pattern="[a-z0-9][a-z0-9_-]{2,63}" required placeholder="sommerfest-2027"></label></p><p><label>Laufzeit <select id="plan"></select></label></p><p><label><input type="checkbox" id="moderation"> Fotos vor Veröffentlichung manuell freigeben (optional)</label></p><button>Event erstellen</button></form><p id="message" role="status"></p><section id="events"></section><section id="photo-manager" hidden><h2 id="manager-title">Fotos verwalten</h2><div id="managed-photos"></div></section></main><script src="/account.js"></script></body></html>
