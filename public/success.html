<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zahlung erfolgreich</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .success-page {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px clamp(24px, 5vw, 48px);
      text-align: center;
    }
    .success-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .link-list {
      text-align: left;
      margin-top: 28px;
    }
    .link-card {
      background: white;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .link-card .link-title {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    .link-card .link-desc {
      font-size: 0.8rem;
      color: var(--color-muted);
      margin-bottom: 8px;
    }
    .link-card .link-url {
      display: block;
      word-break: break-all;
      font-size: 0.85rem;
      color: var(--color-accent-dark);
      background: #faf5ec;
      padding: 8px 10px;
      border-radius: 8px;
      text-decoration: none;
    }
    .pending-msg {
      color: var(--color-muted);
      font-size: 0.9rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header class="site-header"><a class="brand" href="/" aria-label="FinalSnap Startseite"><span class="brand-mark">ϟ</span><span>FinalSnap</span></a></header>
  <main class="success-page">
    <div class="success-icon">🎉</div>
    <h1>Zahlungsstatus prüfen</h1>
    <p id="status-text">Wird geprüft …</p>

    <div class="link-list" id="link-list" style="display:none;"></div>
    <a class="button primary" id="retry-link" href="/dashboard" hidden>Zurück zum Album und Zahlung erneut versuchen</a>
    <p class="pending-msg" id="pending-msg" style="display:none;">
      Die Zahlungsbestätigung kann ein paar Sekunden dauern. Diese Seite aktualisiert
      sich automatisch, sobald alles bereit ist.
    </p>
  </main>

  <script src="/success.js"></script>
<footer class="legal-footer"><a href="/impressum">Impressum</a> · <a href="/datenschutz">Datenschutz</a> · <a href="mailto:info@finalsnap.de">Kontakt</a></footer></body>
</html>
