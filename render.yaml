services:
  - type: web
    name: finalsnap-deutschland
    runtime: node
    region: frankfurt
    plan: starter
    branch: codex/germany-storage
    domains:
      - finalsnap.de
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: finalsnap-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: BASE_URL
        value: https://finalsnap.de
      - key: DB_PATH
        value: /data/events.db
      - key: UPLOAD_DIR
        value: /data/staging
      - key: TRUST_PROXY
        value: "1"
      - key: MAX_EVENT_BYTES
        value: "26843545600"
      - key: S3_BUCKET
        value: finalsnap-foto
      - key: S3_ENDPOINT
        value: "https://nbg1.your-objectstorage.com"
      - key: S3_REGION
        value: "nbg1"
      - key: S3_ACCESS_KEY_ID 
        sync: false
      - key: S3_SECRET_ACCESS_KEY 
        sync: false
      - key: S3_SSE_C_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: info@finalsnap.de
