name: FinalSnap availability
on:
  push:
    branches:
      - codex/germany-storage
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: finalsnap-availability
  cancel-in-progress: true

jobs:
  health:
    name: Check public health endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check liveness and readiness
        env:
          BASE_URL: https://finalsnap.de
        shell: bash
        run: |
          set -euo pipefail
          for path in /health /ready; do
            body="$(mktemp)"
            status="$(curl --silent --show-error --connect-timeout 5 --max-time 20 --retry 2 --retry-delay 5 --retry-all-errors --output "$body" --write-out '%{http_code}' "$BASE_URL$path")"
            if [[ "$status" != "200" ]] || ! grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$body"; then
              echo "::error::$BASE_URL$path returned HTTP $status or an unhealthy response"
              cat "$body"
              exit 1
            fi
            echo "$path is healthy"
          done
